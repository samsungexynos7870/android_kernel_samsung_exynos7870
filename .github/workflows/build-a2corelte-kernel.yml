name: Build a2corelte kernel

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: ubuntu:20.04
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
          TZ: Etc/UTC
        run: |
          apt-get update
          apt-get install -y bc bison build-essential ccache curl flex git gnupg gperf \
          lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5 \
          libncurses5-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync \
          schedtool squashfs-tools xsltproc zip zlib1g-dev python3 wget

      - name: Download GCC 4.9 Toolchain
        run: |
          mkdir -p toolchain
          cd toolchain
          wget -q https://developer.arm.com/-/media/Files/downloads/gnu-a/4.9-2017.01/binrel/gcc-linaro-4.9.4-2017.01-x86_64_aarch64-linux-gnu.tar.xz
          tar -xf gcc-linaro-4.9.4-2017.01-x86_64_aarch64-linux-gnu.tar.xz
          rm gcc-linaro-4.9.4-2017.01-x86_64_aarch64-linux-gnu.tar.xz

      - name: Build Kernel Image
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=$(pwd)/toolchain/gcc-linaro-4.9.4-2017.01-x86_64_aarch64-linux-gnu/bin/aarch64-linux-gnu-
          
          echo "=== Starting Build ==="
          make a2corelte_defconfig
          
          make -j$(nproc) Image 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          
          if [ "$status" -ne 0 ]; then
            echo "=== BUILD FAILED ==="
            echo "Showing last 50 lines of the build log:"
            tail -n 50 build.log
            exit 1
          fi
          
          echo "=== BUILD SUCCESSFUL ==="

      - name: Upload Kernel Image
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: a2corelte_Kernel_Image
          path: arch/arm64/boot/Image
