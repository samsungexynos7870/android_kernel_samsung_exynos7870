name: Build a2corelte kernel

on:
  workflow_dispatch: {}
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    steps:
      - name: Install build dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y git build-essential bc bison flex libssl-dev \
            libncurses-dev python2 python-is-python2 u-boot-tools wget ca-certificates
          python2 --version

      - name: Checkout kernel source
        uses: actions/checkout@v4

      - name: Fetch prebuilt AArch64 4.9 toolchain
        run: |
          git clone https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 \
            toolchain-4.9
          cd toolchain-4.9
          git checkout b4a601fe7b~1
          cd ..
          chmod +x toolchain-4.9/bin/* || true
          echo "=== toolchain-4.9/bin contents ==="
          ls -la toolchain-4.9/bin/ || echo "bin/ does not exist"

      - name: Configure defconfig
        env:
          ARCH: arm64
          ANDROID_MAJOR_VERSION: p
        run: |
          export CROSS_COMPILE="$GITHUB_WORKSPACE/toolchain-4.9/bin/aarch64-linux-android-"
          make exynos7870-a2corelte_defconfig
          echo "=== SELinux configuration ==="
          grep -E 'CONFIG_SECURITY_SELINUX(_DISABLE|_BOOTPARAM|_DEVELOP)?=' .config
          grep -q '^CONFIG_SECURITY_SELINUX_DISABLE=y$' .config

      - name: Build kernel
        env:
          ARCH: arm64
          ANDROID_MAJOR_VERSION: p
        run: |
          export CROSS_COMPILE="$GITHUB_WORKSPACE/toolchain-4.9/bin/aarch64-linux-android-"

          echo "=== Generate A2 Core LTE configuration ==="
          make exynos7870-a2corelte_defconfig

          echo "=== Normalize configuration FIRST ==="
          make olddefconfig

          echo "=== Force SELinux runtime-disable support LAST ==="
          sed -i '/^# CONFIG_SECURITY_SELINUX_DISABLE is not set$/d' .config
          sed -i '/^CONFIG_SECURITY_SELINUX_DISABLE=/d' .config
          echo 'CONFIG_SECURITY_SELINUX_DISABLE=y' >> .config

          echo "=== Verify build configuration ==="
          grep -E '^(CONFIG_SECURITY=|CONFIG_SECURITY_SELINUX=|CONFIG_SECURITY_SELINUX_BOOTPARAM=|CONFIG_SECURITY_SELINUX_BOOTPARAM_VALUE=|CONFIG_SECURITY_SELINUX_DISABLE=|CONFIG_SECURITY_SELINUX_DEVELOP=|CONFIG_DEFAULT_SECURITY=)' .config

          test "$(grep -c '^CONFIG_SECURITY_SELINUX_DISABLE=y$' .config)" = "1" || {
            echo "ERROR: CONFIG_SECURITY_SELINUX_DISABLE=y is missing from .config"
            exit 1
          }

          echo "=== Build kernel Image ==="
          make -j$(nproc) Image > build.log 2>&1
          cat build.log

          echo "=== Verify Image exists ==="
          test -s arch/arm64/boot/Image || {
            echo "ERROR: Kernel Image was not produced"
            exit 1
          }

          echo "=== Extract configuration from FINAL Image ==="
          scripts/extract-ikconfig arch/arm64/boot/Image > final-image.config

          echo "=== Verify FINAL Image SELinux configuration ==="
          grep -E '^(CONFIG_SECURITY=|CONFIG_SECURITY_SELINUX=|CONFIG_SECURITY_SELINUX_BOOTPARAM=|CONFIG_SECURITY_SELINUX_BOOTPARAM_VALUE=|CONFIG_SECURITY_SELINUX_DISABLE=|CONFIG_SECURITY_SELINUX_DEVELOP=|CONFIG_DEFAULT_SECURITY=)' final-image.config

          test "$(grep -c '^CONFIG_SECURITY_SELINUX_DISABLE=y$' final-image.config)" = "1" || {
            echo "ERROR: FINAL KERNEL IMAGE does NOT contain CONFIG_SECURITY_SELINUX_DISABLE=y"
            exit 1
          }

          echo "=== SUCCESS: FINAL IMAGE contains SELinux disable support ==="

      - name: Upload kernel Image + DTB
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a2corelte-kernel-${{ github.run_number }}
          path: |
            arch/arm64/boot/Image
            build.log
          if-no-files-found: warn
