name: Build a2corelte kernel

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    container: ubuntu:20.04

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            bc \
            bison \
            build-essential \
            ca-certificates \
            flex \
            git \
            libssl-dev \
            libncurses5-dev \
            python3

      - name: Prepare GCC 4.9
        run: |
          git clone \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 \
            toolchain-4.9

          cd toolchain-4.9

          git checkout 1182d9bbb6902eb7a5650143dc2d56f520bcc2a2

          echo "=== GCC TOOLCHAIN CHECK ==="
          test -x bin/aarch64-linux-android-gcc
          test -x bin/aarch64-linux-android-g++
          test -x bin/aarch64-linux-android-ld

          bin/aarch64-linux-android-gcc --version | head -n 1

      - name: Build A2 Core LTE Image
        env:
          ARCH: arm64
          ANDROID_MAJOR_VERSION: p
        timeout-minutes: 180
        run: |
          export CROSS_COMPILE="$GITHUB_WORKSPACE/toolchain-4.9/bin/aarch64-linux-android-"

          echo "========================================"
          echo " A2 CORE LTE KERNEL BUILD"
          echo "========================================"

          echo
          echo "=== TOOLCHAIN ==="
          test -x "${CROSS_COMPILE}gcc"
          "${CROSS_COMPILE}gcc" --version | head -n 1

          echo
          echo "=== DEFCONFIG ==="
          make exynos7870-a2corelte_defconfig

          echo
          echo "=== OLDDEFCONFIG ==="
          make olddefconfig

          echo
          echo "=== FORCE CONFIG_SECURITY_SELINUX_DISABLE ==="
          sed -i '/^# CONFIG_SECURITY_SELINUX_DISABLE is not set$/d' .config
          sed -i '/^CONFIG_SECURITY_SELINUX_DISABLE=/d' .config
          echo 'CONFIG_SECURITY_SELINUX_DISABLE=y' >> .config

          echo
          echo "=== CONFIG CHECK ==="
          grep '^CONFIG_SECURITY_SELINUX_DISABLE=' .config
          test "$(grep -c '^CONFIG_SECURITY_SELINUX_DISABLE=y$' .config)" = "1"

          echo
          echo "=== BUILD IMAGE ==="
          echo "CPUs: $(nproc)"

          make -j$(nproc) Image 2>&1 | tee build.log

          echo
          echo "=== CHECK IMAGE ==="

          test -s arch/arm64/boot/Image

          echo
          echo "========================================"
          echo " IMAGE BUILD SUCCESSFUL"
          echo "========================================"

          ls -lh arch/arm64/boot/Image

          echo
          echo "=== FINAL IMAGE CONFIG CHECK ==="

          if [ -f scripts/extract-ikconfig ]; then
            chmod +x scripts/extract-ikconfig || true

            scripts/extract-ikconfig \
              arch/arm64/boot/Image > final-image.config || true

            if grep -q '^CONFIG_SECURITY_SELINUX_DISABLE=y$' final-image.config; then
              echo "CONFIG_SECURITY_SELINUX_DISABLE=y VERIFIED"
            else
              echo "WARNING: final Image config could not be verified"
            fi
          fi

          echo
          echo "=== DONE ==="

      - name: Upload kernel Image and build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a2corelte-kernel-Image-${{ github.run_number }}
          path: |
            arch/arm64/boot/Image
            build.log
            final-image.config
          if-no-files-found: warn
