name: Build a2corelte kernel

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: ubuntu:20.04
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
          TZ: Etc/UTC
        run: |
          apt-get update
          apt-get install -y bc bison build-essential ccache curl flex git gnupg gperf \
          lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5 \
          libncurses5-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync \
          schedtool squashfs-tools xsltproc zip zlib1g-dev python3 wget file perl

      - name: Fetch AOSP GCC 4.9 Toolchain
        run: |
          rm -rf toolchain-4.9
          git clone https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 toolchain-4.9
          cd toolchain-4.9
          git checkout a7bb6f39cd99b2fb26ecc2d3cb984d18cd259d24
          cd ..

      - name: Validate Toolchain
        shell: bash
        run: |
          export PATH=$(pwd)/toolchain-4.9/bin:$PATH
          echo "=== GCC FILE CHECK ==="
          file toolchain-4.9/bin/aarch64-linux-android-gcc
          echo "=== GCC VERSION ==="
          aarch64-linux-android-gcc --version
          
          if ! aarch64-linux-android-gcc --version 2>&1 | grep -Eq "4\.9|4\.9\.x-google"; then
            echo "ERROR: Genuine GCC 4.9 was not obtained"
            exit 1
          fi
          echo "Toolchain validation PASSED."

      - name: Patch Kernel Source
        run: |
          # FIX 1: Add missing headers to fs/dlog_hook.c (sched.h resolves current->cred)
          perl -pi -e 'print "#include <linux/sched.h>\n#include <linux/magic.h>\n#include <linux/cred.h>\n" if $. == 1' fs/dlog_hook.c
          
          # FIX 2: Comment out broken rq->avg lines in scheduler
          perl -pi -e 's/^\s*rq_of\(cfs_rq\)->avg\.load_avg_ratio \+= ratio_delta;/\t\/\/ rq_of(cfs_rq)->avg.load_avg_ratio += ratio_delta;/' kernel/sched/fair.c
          perl -pi -e 's/^\s*rq_of\(cfs_rq\)->avg\.load_avg_ratio \+= se->avg\.load_avg_ratio;/\t\/\/ rq_of(cfs_rq)->avg.load_avg_ratio += se->avg.load_avg_ratio;/' kernel/sched/fair.c
          perl -pi -e 's/^\s*rq_of\(cfs_rq\)->avg\.load_avg_ratio -= se->avg\.load_avg_ratio;/\t\/\/ rq_of(cfs_rq)->avg.load_avg_ratio -= se->avg.load_avg_ratio;/' kernel/sched/fair.c
          
          # FIX 3: Replace nohz_test_cpu declaration with dummy function
          perl -pi -e 's/^.*static int nohz_test_cpu\(int cpu\);.*$/static int nohz_test_cpu(int cpu) { return 0; }/' kernel/sched/fair.c
          
          echo "Kernel source patched successfully."

      - name: Build Kernel Image
        shell: bash
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=$(pwd)/toolchain-4.9/bin/aarch64-linux-android-
          export ANDROID_MAJOR_VERSION=p
          
          echo "=== Starting Build ==="
          make a2corelte_defconfig
          make olddefconfig
          
          make KCFLAGS="-Wno-error" -j$(nproc) Image 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          
          if [ "$status" -ne 0 ]; then
            echo "=== BUILD FAILED ==="
            echo "Showing last 50 lines of the build log:"
            tail -n 50 build.log
            exit 1
          fi
          
          echo "=== BUILD SUCCESSFUL ==="

      - name: Upload Kernel Image
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: a2corelte_Kernel_Image
          path: arch/arm64/boot/Image
