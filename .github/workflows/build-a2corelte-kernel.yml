name: Build a2corelte kernel

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    container: ubuntu:20.04

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            bc \
            bison \
            build-essential \
            ca-certificates \
            flex \
            git \
            libssl-dev \
            libncurses5-dev \
            python3

      - name: Prepare GCC 4.9
        run: |
          git clone \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 \
            toolchain-4.9

          cd toolchain-4.9
          git checkout b4a601fe7b~1

      - name: Build kernel Image
        env:
          ARCH: arm64
          ANDROID_MAJOR_VERSION: p
        timeout-minutes: 180
        run: |
          export CROSS_COMPILE="$GITHUB_WORKSPACE/toolchain-4.9/bin/aarch64-linux-android-"

          echo "========================================"
          echo "       A2 CORE LTE KERNEL BUILD"
          echo "========================================"

          echo
          echo "=== DEFCONFIG ==="
          make exynos7870-a2corelte_defconfig

          echo
          echo "=== OLDDEFCONFIG ==="
          make olddefconfig

          echo
          echo "=== FORCE SELINUX DISABLE SUPPORT ==="
          sed -i '/^# CONFIG_SECURITY_SELINUX_DISABLE is not set$/d' .config
          sed -i '/^CONFIG_SECURITY_SELINUX_DISABLE=/d' .config
          echo 'CONFIG_SECURITY_SELINUX_DISABLE=y' >> .config

          echo
          echo "=== CONFIG CHECK ==="
          grep '^CONFIG_SECURITY_SELINUX_DISABLE=' .config

          test "$(grep -c '^CONFIG_SECURITY_SELINUX_DISABLE=y$' .config)" = "1"

          echo
          echo "=== BUILD ==="
          echo "CPUs: $(nproc)"
          echo "Compiler: ${CROSS_COMPILE}gcc"
          "${CROSS_COMPILE}gcc" --version | head -n 1

          echo
          echo "=== COMPILING Image ==="

          make -j$(nproc) Image 2>&1 | tee build.log

          echo
          echo "=== IMAGE CHECK ==="

          if [ ! -s arch/arm64/boot/Image ]; then
            echo
            echo "ERROR: arch/arm64/boot/Image was not produced."
            echo
            echo "=== LAST 200 BUILD LOG LINES ==="
            tail -n 200 build.log
            exit 1
          fi

          echo
          echo "========================================"
          echo "       KERNEL IMAGE BUILD SUCCESS"
          echo "========================================"
          ls -lh arch/arm64/boot/Image

          echo
          echo "=== FINAL IMAGE CONFIG ==="

          if [ -x scripts/extract-ikconfig ]; then
            scripts/extract-ikconfig \
              arch/arm64/boot/Image > final-image.config

            grep '^CONFIG_SECURITY_SELINUX_DISABLE=' final-image.config || true
          fi

          echo
          echo "=== BUILD COMPLETE ==="

      - name: Upload kernel Image
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a2corelte-kernel-Image-${{ github.run_number }}
          path: |
            arch/arm64/boot/Image
            build.log
            final-image.config
          if-no-files-found: warn
