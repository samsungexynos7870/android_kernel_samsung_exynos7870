name: Build Exynos 7870 Kernel

on:
  push:
    branches: [ "clean-build", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: ubuntu:20.04
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
          TZ: Etc/UTC
        run: |
          apt-get update
          apt-get install -y bc bison build-essential ccache curl flex git gnupg gperf \
          lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5 \
          libncurses5-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync \
          schedtool squashfs-tools xsltproc zip zlib1g-dev python3 wget file perl

      - name: Fetch AOSP GCC 4.9 Toolchain
        run: |
          git clone https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 toolchain-4.9
          cd toolchain-4.9
          git checkout a7bb6f39cd99b2fb26ecc2d3cb984d18cd259d24

      - name: Build Kernel Image
        shell: bash
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=$(pwd)/toolchain-4.9/bin/aarch64-linux-android-
          export ANDROID_MAJOR_VERSION=p
          
          echo "=== Starting Build ==="
          make a2corelte_defconfig
          make olddefconfig
          
          make KCFLAGS="-Wno-error" -j$(nproc) Image 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          
          if [ "$status" -ne 0 ]; then
            echo "=== BUILD FAILED ==="
            tail -n 50 build.log
            exit 1
          fi
          
          echo "=== BUILD SUCCESSFUL ==="

      - name: Upload Kernel Image
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Kernel_Image
          path: arch/arm64/boot/Image
