name: Build Exynos 7870 Kernel

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: ubuntu:20.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
          TZ: Etc/UTC
        run: |
          apt-get update
          apt-get install -y bc bison build-essential ccache curl flex git gnupg gperf \
          lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5 \
          libncurses5-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync \
          schedtool squashfs-tools xsltproc zip zlib1g-dev python3 wget file perl

      - name: Fetch AOSP GCC 4.9 Toolchain
        run: |
          git clone https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 toolchain-4.9
          cd toolchain-4.9
          git checkout a7bb6f39cd99b2fb26ecc2d3cb984d18cd259d24

      - name: Apply All Patches
        run: |
          echo "=== APPLYING PATCHES ==="
          
          # PATCH 1: Fix fs/dlog_hook.c missing headers
          perl -pi -e 'print "#include <linux/sched.h>\n#include <linux/magic.h>\n#include <linux/cred.h>\n" if $. == 1' fs/dlog_hook.c
          
          # PATCH 2: Fix kernel/sched/fair.c broken Samsung load tracking
          perl -pi -e 's/^\s*rq_of\(cfs_rq\)->avg\.load_avg_ratio \+= ratio_delta;/\t\/\/ rq_of(cfs_rq)->avg.load_avg_ratio += ratio_delta;/' kernel/sched/fair.c
          perl -pi -e 's/^\s*rq_of\(cfs_rq\)->avg\.load_avg_ratio \+= se->avg\.load_avg_ratio;/\t\/\/ rq_of(cfs_rq)->avg.load_avg_ratio += se->avg.load_avg_ratio;/' kernel/sched/fair.c
          perl -pi -e 's/^\s*rq_of\(cfs_rq\)->avg\.load_avg_ratio -= se->avg\.load_avg_ratio;/\t\/\/ rq_of(cfs_rq)->avg.load_avg_ratio -= se->avg.load_avg_ratio;/' kernel/sched/fair.c
          perl -pi -e 's/^.*static int nohz_test_cpu\(int cpu\);.*$/static int nohz_test_cpu(int cpu) { return 0; }/' kernel/sched/fair.c
          
          # PATCH 3: Handle missing GPU directory
          sed -i '/arm/d' drivers/gpu/Makefile
          mkdir -p drivers/gpu/arm
          echo "obj-y := " > drivers/gpu/arm/Makefile
          
          # PATCH 4: Fix input booster macros
          perl -pi -e 'print "#ifndef PROPERTY_BOOSTER\n#define PROPERTY_BOOSTER(a, b, c)\n#endif\n#ifndef SET_BOOSTER\n#define SET_BOOSTER\n#endif\n#ifndef REMOVE_BOOSTER\n#define REMOVE_BOOSTER\n#endif\n" if $. == 1' include/linux/input/input.h
          
          # PATCH 5: Add linker stubs to kernel/panic.c
          cat >> kernel/panic.c << 'STUBS'
          
          /* === CUSTOM STUBS FOR MISSING SAMSUNG VENDOR SYMBOLS === */
          #include <linux/sched.h>
          void exynos_ss_panic_handler_safe(void) { }
          int lcd_is_on(void) { return 0; }
          void acct_update_power(struct task_struct *p, cputime_t cputime) { }
          void sysrq_sched_debug_show(void) { }
          /* ======================================================= */
          STUBS
          
          echo "=== ALL PATCHES APPLIED ==="

      - name: Build Kernel Image
        shell: bash
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=$(pwd)/toolchain-4.9/bin/aarch64-linux-android-
          export ANDROID_MAJOR_VERSION=p
          
          echo "=== Starting Build ==="
          make a2corelte_defconfig
          make olddefconfig
          
          make KCFLAGS="-Wno-error" -j$(nproc) Image 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          
          if [ "$status" -ne 0 ]; then
            echo "=== BUILD FAILED ==="
            tail -n 50 build.log
            exit 1
          fi
          
          echo "=== BUILD SUCCESSFUL ==="

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build_log
          path: build.log

      - name: Upload Kernel Image
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Kernel_Image
          path: arch/arm64/boot/Image
